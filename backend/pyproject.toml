[project]
name = "videre"
version = "0.1.0"
description = "See, and budget, what an AI agent does."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "google-genai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    # google-genai's generated types.py has invalid escapes in docstrings (Python 3.12+).
    "ignore:\"\\\\/\" is an invalid escape sequence:SyntaxWarning",
]
markers = [
    "live: hits the PayPal sandbox or Gemini; skipped unless --live is passed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
